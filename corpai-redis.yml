# corpai-redis.yml — sre_executor 用的 Redis Stream broker
# v3.2:启用 — sre_executor 已写好,Redis 是它的事务 broker

services:
  redis:
    container_name: corpai-redis
    image: redis:6-alpine
    ports: ["127.0.0.1:16379:6379"]
    volumes: [corpai_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
volumes:
  corpai_redis: