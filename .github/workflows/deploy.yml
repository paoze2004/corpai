# GitHub Actions Deploy — CorpAI
#
# 触发:手动 dispatch(workflow_dispatch),选择环境
# 流程:build 多架构镜像 + push 到 GHCR + 触发 staging/production
# 注意:不在 PR 触发,避免意外部署
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "目标环境"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      version:
        description: "镜像 tag(留空 = latest main 分支)"
        required: false
        type: string
        default: ""

concurrency:
  # 同一环境串行部署,避免竞争
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build + push hr_assistant image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.plugin
          build-args: PLUGIN_NAME=hr_assistant
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/hr-assistant:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push sre_copilot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.plugin
          build-args: PLUGIN_NAME=sre_copilot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/devops-copilot:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push faq image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.plugin
          build-args: PLUGIN_NAME=faq
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/faq:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to environment
        run: |
          echo "::notice::镜像已推送:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.value }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/hr-assistant:${{ steps.version.outputs.value }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/devops-copilot:${{ steps.version.outputs.value }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/faq:${{ steps.version.outputs.value }}"
          echo ""
          echo "环境 ${{ inputs.environment }} 由运维拉取新镜像并执行:"
          echo "  docker compose -f corpai-platform.yml pull"
          echo "  docker compose -f corpai-platform.yml up -d"
          # 后续可接入 k8s rollout / ECS update / ArgoCD sync(后续 Phase 5.2)