# GitHub Actions CI — CorpAI
#
# 触发:push / pull_request 到 master/main
# 流程:lint(ruff) → test(pytest,带 MySQL service) → build(仅 main 触发 docker build)
# 缓存:uv 装在 ~/ .cache/uv,actions/cache 命中后秒级 restore
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一 PR 取消上一次 in-progress 的运行,节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CI 用的 MySQL 凭证(services 容器自动注入)
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: test_root_pwd
  MYSQL_DATABASE: CorpAI
  # 测试用 JWT 密钥(必须 ≥32 字节,Phase 3 RBAC 强制要求)
  AUTH_JWT_SECRET: ci-test-jwt-secret-min-32-chars-aaaa

jobs:
  # ─── 1. Lint(独立 job,出问题就 fail-fast)───
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check(非阻塞,已知 legacy 27 个待清理)
        uses: astral-sh/ruff-action@v1
        with:
          args: "check --exit-zero"
          src: "./"
        # legacy ruff errors 太多(--exit-zero 不 fail,只报告)
        # 新增错误仍可见;Phase 6 慢慢收拾

      - name: Ruff format check(阻塞,确保 PR 不破格式)
        uses: astral-sh/ruff-action@v1
        with:
          # format --check 只报不写,确保 CI 不自动改 PR
          args: "format --check"

  # ─── 2. Test(全测试 + MySQL service container)───
  test:
    name: pytest (platform + plugins)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pwd
          MYSQL_DATABASE: CorpAI
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest_root_pwd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # 第一次跑会拉镜像,后用 GHCR cache 加速

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies (含 dev 组)
        run: uv sync --group dev

      - name: Sync plugins(hr/devops/faq)
        # plugin 各自独立 pyproject + uv.lock,本地安装到当前 venv
        run: |
          for plugin in hr_assistant sre_copilot faq; do
            cd "plugins/$plugin"
            uv sync || { echo "::error::plugin $plugin sync 失败"; exit 1; }
            cd ../..
          done

      - name: Create test DB tables
        # sql/create_all_tables.sql + sql/create_hr_tables.sql 都跑,幂等(IF NOT EXISTS)
        run: |
          mysql -h 127.0.0.1 -u root -ptest_root_pwd CorpAI < sql/create_all_tables.sql
          mysql -h 127.0.0.1 -u root -ptest_root_pwd CorpAI < sql/create_hr_tables.sql || true

      - name: Run platform tests
        run: uv run pytest tests/ -m "not integration" --tb=short

      - name: Run hr_assistant plugin tests
        working-directory: plugins/hr_assistant
        run: uv run pytest tests/ --tb=short

      - name: Run sre_copilot plugin tests
        working-directory: plugins/sre_copilot
        run: uv run pytest tests/ --tb=short

      - name: Run faq plugin tests
        working-directory: plugins/faq
        run: uv run pytest tests/ --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ─── 3. Build(只在 main 跑,验证 Dockerfile)───
  build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: corpai-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hr_assistant image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.plugin
          build-args: PLUGIN_NAME=hr_assistant
          push: false
          tags: corpai-hr-assistant:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max