<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Users — CorpAI Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="header">
    <h1>🛡️ CorpAI Admin</h1>
    <span class="muted" id="who"></span>
    <span class="spacer"></span>
    <button onclick="logout()">退出</button>
    <a href="/admin/index.html">← 返回</a>
</div>
<div class="nav">
    <a href="/admin/agents.html">Agents</a>
    <a href="/admin/tools.html">Tools</a>
    <a href="/admin/users.html" class="active">Users</a>
    <a href="/admin/logs.html">Logs</a>
    <a href="/admin/metrics.html">Metrics</a>
</div>

<div class="container">
    <h2 style="color:#e94560; margin-bottom:16px;">用户管理</h2>
    <div class="panel" id="content">加载中...</div>
</div>

<script src="/admin/admin.js"></script>
<script>
const role = localStorage.getItem('admin_role');
document.getElementById('who').textContent =
    (localStorage.getItem('admin_username') || '?') + ' (' + (role || '?') + ')';

const ROLES = ['employee', 'agent_author', 'admin', 'super_admin'];
let isSuper = false;

(async () => {
    try {
        const data = await apiFetch('/users');
        if (!data.data || data.data.length === 0) {
            document.getElementById('content').innerHTML = '<p class="muted">无用户</p>';
            return;
        }
        isSuper = (role === 'super_admin');
        const cols = [
            { key: 'username', title: '用户名' },
            { key: 'role', title: '角色' },
            {
                key: 'is_active', title: '状态',
                render: r => r.is_active
                    ? '<span class="badge badge-success">active</span>'
                    : '<span class="badge badge-deny">disabled</span>'
            },
            {
                key: 'last_login_at', title: '最后登录',
                render: r => fmtTime(r.last_login_at)
            },
        ];
        if (isSuper) {
            cols.push({
                key: 'user_id', title: '操作',
                render: r => `<select onchange="changeRole('${r.user_id}', this.value)">
                    ${ROLES.map(rl => `<option value="${rl}" ${rl === r.role ? 'selected' : ''}>${rl}</option>`).join('')}
                </select>`
            });
        }
        document.getElementById('content').innerHTML = renderTable(data.data, cols) +
            `<p class="muted mt-12">${isSuper ? '你是 super_admin — 可编辑角色。' : '需要 super_admin 权限才能改角色。'}</p>`;
    } catch (e) {
        document.getElementById('content').innerHTML =
            `<div class="alert alert-error">加载失败: ${e.message}</div>`;
    }
})();

async function changeRole(userId, newRole) {
    if (!confirm(`将 ${userId} 改为 ${newRole}?`)) { location.reload(); return; }
    try {
        await apiFetch(`/users/${userId}/role?role=${newRole}`, { method: 'POST' });
        alert('已更新');
        location.reload();
    } catch (e) {
        alert('错误: ' + e.message);
    }
}
</script>
</body>
</html>
