<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Agents — CorpAI Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="header">
    <h1>🛡️ CorpAI Admin</h1>
    <span class="muted" id="who"></span>
    <span class="spacer"></span>
    <button onclick="logout()">退出</button>
    <a href="/admin/index.html">← 返回</a>
</div>
<div class="nav">
    <a href="/admin/agents.html" class="active">Agents</a>
    <a href="/admin/tools.html">Tools</a>
    <a href="/admin/users.html">Users</a>
    <a href="/admin/logs.html">Logs</a>
    <a href="/admin/metrics.html">Metrics</a>
</div>

<div class="container">
    <h2 style="color:#e94560; margin-bottom:16px;">Plugins <span class="muted">(llm_agent + mcp_tool)</span></h2>
    <div class="panel" id="content">加载中...</div>
</div>

<script src="/admin/admin.js"></script>
<script>
document.getElementById('who').textContent =
    (localStorage.getItem('admin_username') || '?') + ' (' + (localStorage.getItem('admin_role') || '?') + ')';

(async () => {
    try {
        const data = await apiFetch('/plugins');
        if (!data.data || data.data.length === 0) {
            document.getElementById('content').innerHTML =
                '<p class="muted">无插件。Agent 通过 entry_points 注册,见 docs/adr/0003-plugin-registration.md。</p>';
            return;
        }
        document.getElementById('content').innerHTML = renderTable(data.data, [
            { key: 'name', title: '名称' },
            { key: 'version', title: '版本' },
            {
                key: 'plugin_type', title: '类型',
                render: r => `<span class="badge ${r.plugin_type === 'llm_agent' ? 'badge-success' : ''}">${r.plugin_type}</span>`
            },
            { key: 'endpoint', title: '端点', render: r => r.endpoint || '<span class="muted">—</span>' },
            {
                key: 'required_intents', title: '处理意图',
                render: r => (r.required_intents || []).map(i => `<span class="badge">${i}</span>`).join(' ') || '—'
            },
            {
                key: 'tags', title: '标签',
                render: r => (r.tags || []).map(t => `<span class="badge">${t}</span>`).join(' ') || '—'
            },
            { key: 'description', title: '描述' },
        ]) + paginated(data);
    } catch (e) {
        document.getElementById('content').innerHTML =
            `<div class="alert alert-error">加载失败: ${e.message}</div>`;
    }
})();
</script>
</body>
</html>
